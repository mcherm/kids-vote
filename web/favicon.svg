<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- ballot box -->
  <rect x="3" y="12" width="26" height="18" rx="2" fill="#1c7ed6" stroke="#2b2b2b" stroke-width="2"/>
  <!-- ballot, tilted a little, going into the slot -->
  <polygon points="12,3.3 23.9,5 21.8,19.8 9.9,18.2" fill="#ffe100" stroke="#2b2b2b" stroke-width="2" stroke-linejoin="round"/>
  <!-- slot -->
